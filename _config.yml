# Site settings. Jekyll does not reload this file while `jekyll serve` runs;
# restart the server after editing it.

title       : "Kassey Guertin-Chang"
description : "Kassey Guertin-Chang builds and evaluates language models, and the guardrails and data practices that keep them safe, fair and accountable."
url         : https://kasseygc.github.io
baseurl     : ""
repository  : "kasseygc/kasseygc.github.io"
timezone    : America/Los_Angeles
future      : true

author:
  name     : "Kassey Guertin-Chang"
  email    : "kasseyguertin@gmail.com"
  github   : "kasseygc"
  linkedin : "kasseyc"
  location : "Canada"
  avatar   : "/images/profile2.jpg"

# Multilingual (jekyll-polyglot). Not on the GitHub Pages allowlist, so the
# site is built by .github/workflows/pages.yml instead of the classic builder.
languages                 : ["en", "fr-CA", "de", "zh-HK"]
default_lang              : "en"
exclude_from_localization : ["assets", "images", "files", "feed.xml", "robots.txt", "sitemap.xml"]
parallel_localization     : true
lang_from_path            : true

include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - design
  - DESIGN.md

markdown    : kramdown
highlighter : rouge
kramdown:
  input          : GFM
  hard_wrap      : false
  auto_ids       : true
  footnote_nr    : 1
  entity_output  : as_char
  smart_quotes   : lsquo,rsquo,ldquo,rdquo
excerpt_separator: "\n\n"

collections:
  portfolio:
    output    : true
    permalink : /:collection/:path/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: portfolio }
    values: { layout: post }
  - scope: { path: "", type: pages }
    values: { layout: page }

permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-polyglot

feed:
  path: feed.xml
