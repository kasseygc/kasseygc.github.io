<dialog class="palette" id="palette" aria-label="{{ t.palette_open }}">
  <div class="palette-bar">
    <span class="palette-prompt" aria-hidden="true">›</span>
    <input class="palette-input" id="palette-input" type="text" placeholder="{{ t.palette_placeholder }}"
           autocomplete="off" autocapitalize="off" spellcheck="false"
           role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
    <button class="palette-esc" type="button" data-action="palette-close"><kbd>esc</kbd></button>
  </div>
  <ul class="palette-list" id="palette-list" role="listbox" aria-label="{{ t.palette_open }}"></ul>
  <div class="palette-foot" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
</dialog>
{%- assign research = site.portfolio | sort: 'order' -%}
<script type="application/json" id="palette-data">
{
  "prefix": {{ prefix | jsonify }},
  "path": {{ pure_path | jsonify }},
  "lang": {{ lang | jsonify }},
  "defaultLang": {{ site.default_lang | jsonify }},
  "none": {{ t.palette_none | jsonify }},
  "groups": {
    "pages": {{ t.palette_pages | jsonify }},
    "work": {{ t.palette_work | jsonify }},
    "research": {{ t.palette_research | jsonify }},
    "writing": {{ t.palette_writing | jsonify }},
    "actions": {{ t.palette_actions | jsonify }}
  },
  "items": [
    {"g": "pages", "t": {{ t.home | jsonify }}, "s": "~/", "u": "/"},
    {%- for link in site.data.navigation.main %}
    {"g": "pages", "t": {{ link[title_key] | default: link.title | jsonify }}, "s": {{ link.url | prepend: '~' | jsonify }}, "u": {{ link.url | jsonify }}},
    {%- endfor %}
    {%- for group in site.data.tech_projects %}{% for item in group.items %}
    {"g": "work", "t": {{ item.title | jsonify }}, "s": {{ item.tag | jsonify }}, "u": {{ item.url | jsonify }}},
    {%- endfor %}{% endfor %}
    {%- for p in research %}
    {"g": "research", "t": {{ p.title | jsonify }}, "s": {{ p.studied | jsonify }}, "u": {{ p.url | jsonify }}},
    {%- endfor %}
    {%- for post in site.posts %}
    {"g": "writing", "t": {{ post.title | jsonify }}, "s": {{ post.date | date: '%Y' | jsonify }}, "u": {{ post.url | jsonify }}},
    {%- endfor %}
    {"g": "actions", "t": {{ t.action_theme | jsonify }}, "a": "theme"},
    {"g": "actions", "t": {{ t.action_email | jsonify }}, "s": {{ site.author.email | jsonify }}, "a": "email"},
    {"g": "actions", "t": {{ t.action_grid | jsonify }}, "s": "g", "a": "grid"},
    {"g": "actions", "t": {{ t.action_lang | append: ' English' | jsonify }}, "s": "en", "a": "lang", "l": "en"},
    {"g": "actions", "t": {{ t.action_lang | append: ' Français' | jsonify }}, "s": "fr-CA", "a": "lang", "l": "fr-CA"},
    {"g": "actions", "t": {{ t.action_lang | append: ' Deutsch' | jsonify }}, "s": "de", "a": "lang", "l": "de"},
    {"g": "actions", "t": {{ t.action_lang | append: ' 中文' | jsonify }}, "s": "zh-HK", "a": "lang", "l": "zh-HK"}
  ]
}
</script>
