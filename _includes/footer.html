<footer class="site-footer">
  <div class="foot-col">
    <p>{{ site.author.name }}</p>
    <p class="muted">{{ t.tagline }}</p>
    <p class="muted">{{ t.based }}</p>
  </div>
  <div class="foot-col">
    <p>{{ t.contact }}</p>
    <p><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></p>
    <p><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" rel="me">LinkedIn ↗</a></p>
    <p><a href="https://github.com/{{ site.author.github }}" rel="me">GitHub ↗</a></p>
  </div>
  <div class="foot-col">
    <p>{{ t.language }}</p>
    {% include lang-switch.html %}
  </div>
  <div class="foot-col foot-end">
    <p class="muted">© {{ site.time | date: '%Y' }}</p>
  </div>
</footer>
